services:
  backend:
    build:
      context: ./backend
    container_name: mathkids-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/mathkids.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - backend-data:/data
    networks:
      - mathkids

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: mathkids-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - mathkids

volumes:
  backend-data:

networks:
  mathkids:
